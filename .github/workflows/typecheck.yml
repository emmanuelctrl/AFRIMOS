name: Typecheck

on:
  pull_request:
    branches: [main]

# Least privilege: this job only reads the tree.
permissions:
  contents: read

# A new push to the same PR makes the in-flight run irrelevant.
concurrency:
  group: typecheck-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # client/package.json asks for >=18; 20 is the current LTS.
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json

      # `ci` rather than `install`, so the lockfile is honoured exactly and a
      # drifting dependency fails here instead of silently resolving.
      - name: Install dependencies
        run: npm ci
        working-directory: client

      - name: Typecheck
        run: npm run typecheck
        working-directory: client
